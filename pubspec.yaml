name: ucu_smart_plus
description: UCU Smart+ interactive 2D campus navigation app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logoo.png

flutter:
  uses-material-design: true

  assets:
    - assets/audio/destination_success.wav
    - assets/images/ucu_campus_map.png
    - assets/images/logo.png
    - assets/images/logoo.png
    - assets/images/background.png
    - assets/images/destination-mark.jpg
